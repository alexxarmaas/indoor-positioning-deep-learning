name: ipscm
services:
    server:
      image: simonrusu97/ipscmback
      environment:
        CUBLAS_WORKSPACE_CONFIG: ':4096:8'
      build: 
        context: ./IPSCM
        dockerfile: Dockerfile
      ports:
        - "5000:5000"
      volumes:
        - ipscm-data:/app/db
        - ./Resultados:/app/Resultados

    client:
      image: simonrusu97/ipscmfront
      build: 
        context: ./IPSCM.WebClient
        dockerfile: Dockerfile
      ports:
        - "4200:80"

volumes:
  ipscm-data:
